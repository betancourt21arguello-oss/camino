<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jardín Demo — Camino</title>
<style>
  :root {
    --bg: #f7f6f3;
    --panel-bg: #ffffff;
    --border: #e6e3db;
    --accent: #1c1c1e;
    --text: #1c1c1e;
    --muted: #9a9a9f;
    --highlight: #c4a35a;
    --section-bg: #fafaf7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    height: 100vh;
  }
  #app {
    display: flex;
    height: 100vh;
  }
  #controls {
    width: 340px;
    min-width: 340px;
    background: var(--panel-bg);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #controls h2 {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--accent);
    margin-bottom: 4px;
  }
  #controls h3 {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 12px 0 6px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }
  #controls h3:first-child { margin-top: 0; }
  .ctrl-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 3px 0;
  }
  .ctrl-row label {
    font-size: 12px;
    color: var(--text);
    flex-shrink: 0;
    min-width: 100px;
  }
  .ctrl-row .val {
    font-size: 11px;
    font-family: monospace;
    color: var(--muted);
    min-width: 36px;
    text-align: right;
  }
  .ctrl-row select, .ctrl-row input[type="range"] {
    flex: 1;
  }
  .ctrl-row input[type="text"] {
    flex: 1;
    font-size: 11px;
    padding: 3px 6px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-family: monospace;
  }
  .ctrl-row input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
  }
  select {
    font-size: 11px;
    padding: 3px 6px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: white;
  }
  input[type="range"] {
    -webkit-appearance: none;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }
  #svg-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #e8e4dc;
    position: relative;
    overflow: hidden;
  }
  #svg-container svg {
    max-width: 100%;
    max-height: 100%;
    height: auto;
  }
  .dna-badge {
    position: absolute;
    top: 12px;
    left: 12px;
    background: rgba(0,0,0,0.6);
    color: white;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 10px;
    font-family: monospace;
    pointer-events: none;
  }
  .reset-btn {
    padding: 6px 12px;
    font-size: 11px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: white;
    cursor: pointer;
    color: var(--muted);
    transition: all 0.15s;
  }
  .reset-btn:hover { background: var(--accent); color: white; border-color: var(--accent); }
  .section-body { padding-left: 8px; }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    margin-top: 4px;
  }
  .stat-item {
    background: var(--section-bg);
    border-radius: 6px;
    padding: 4px 6px;
    text-align: center;
  }
  .stat-item .stat-val { font-size: 14px; font-weight: 700; }
  .stat-item .stat-label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent);
    color: white;
    padding: 8px 20px;
    border-radius: 8px;
    font-size: 12px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 100;
  }
  .toast.show { opacity: 1; }
  @media (max-width: 768px) {
    #app { flex-direction: column; }
    #controls { width: 100%; min-width: unset; max-height: 40vh; }
    #svg-container { min-height: 60vh; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="controls">
    <h2>🌿 Jardín Demo</h2>
    <button class="reset-btn" id="resetBtn" title="Reset all values to defaults">↺ Reset</button>

    <h3>🧬 DNA Traits</h3>
    <div class="ctrl-row"><label>Terrain</label><select id="dna-terrain"></select></div>
    <div class="ctrl-row"><label>Path Shape</label><select id="dna-pathShape"></select></div>
    <div class="ctrl-row"><label>Tree Species</label><select id="dna-treeSpecies"></select></div>
    <div class="ctrl-row"><label>Rock Pattern</label><input type="range" id="dna-rockPattern" min="0" max="3" step="1" value="0"><span class="val" id="val-dna-rockPattern">0</span></div>
    <div class="ctrl-row"><label>River Angle</label><input type="range" id="dna-riverAngle" min="0" max="359" step="1" value="0"><span class="val" id="val-dna-riverAngle">0</span></div>
    <div class="ctrl-row"><label>Palette</label><select id="dna-paletteVariant"></select></div>
    <div class="ctrl-row"><label>Flower Bias</label><select id="dna-flowerSpeciesBias"></select></div>
    <div class="ctrl-row"><label>Signature Seed</label><input type="text" id="dna-signatureSeed" value="demo-seed-001"></div>

    <h3>📊 Garden State</h3>
    <div class="ctrl-row"><label>Rosaries</label><input type="range" id="state-totalRosaries" min="0" max="30" step="1" value="0"><span class="val" id="val-state-totalRosaries">0</span></div>
    <div class="ctrl-row"><label>Novenas</label><input type="range" id="state-totalNovenas" min="0" max="30" step="1" value="0"><span class="val" id="val-state-totalNovenas">0</span></div>
    <div class="ctrl-row"><label>Coronillas</label><input type="range" id="state-totalCoronillas" min="0" max="30" step="1" value="0"><span class="val" id="val-state-totalCoronillas">0</span></div>
    <div class="ctrl-row"><label>Waterings</label><input type="range" id="state-totalWaterings" min="0" max="30" step="1" value="0"><span class="val" id="val-state-totalWaterings">0</span></div>
    <div class="ctrl-row"><label>Seeds</label><input type="range" id="state-totalSeeds" min="0" max="60" step="1" value="0"><span class="val" id="val-state-totalSeeds">0</span></div>
    <div class="ctrl-row"><label>Silence (min)</label><input type="range" id="state-totalSilenceMinutes" min="0" max="120" step="5" value="0"><span class="val" id="val-state-totalSilenceMinutes">0</span></div>
    <div class="ctrl-row"><label>Streak</label><input type="range" id="state-streak" min="0" max="30" step="1" value="0"><span class="val" id="val-state-streak">0</span></div>
    <div class="ctrl-row"><label>Community</label><input type="range" id="state-communityPrayer" min="0" max="15" step="1" value="0"><span class="val" id="val-state-communityPrayer">0</span></div>
    <div class="ctrl-row"><label>Water Level</label><input type="range" id="state-waterLevel" min="0" max="100" step="1" value="0"><span class="val" id="val-state-waterLevel">0</span></div>
    <div class="ctrl-row"><label>Light Level</label><input type="range" id="state-lightLevel" min="0" max="100" step="1" value="22"><span class="val" id="val-state-lightLevel">22</span></div>
    <div class="ctrl-row"><label>Health</label><input type="range" id="state-health" min="0" max="1" step="0.01" value="1"><span class="val" id="val-state-health">1.00</span></div>
    <div class="ctrl-row"><label>Level</label><input type="range" id="state-level" min="0" max="10" step="1" value="0"><span class="val" id="val-state-level">0</span></div>
    <div class="ctrl-row"><label>Growth Phase</label><select id="state-growthPhase"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></div>
    <div class="ctrl-row"><label>Season</label><select id="state-season"><option value="advent">Advent</option><option value="christmas">Christmas</option><option value="lent">Lent</option><option value="easter">Easter</option><option value="pentecost">Pentecost</option><option value="ordinary" selected>Ordinary</option></select></div>
    <div class="ctrl-row"><label>Show Dove</label><input type="checkbox" id="state-showDove"></div>
    <div class="ctrl-row"><label>Show Deer</label><input type="checkbox" id="state-showDeer"></div>
    <div class="ctrl-row"><label>Consolidated Rosal</label><input type="checkbox" id="state-consolidatedRosal"></div>
    <div class="ctrl-row"><label>Watering Effect</label><input type="range" id="state-wateringEffectStrength" min="0" max="1" step="0.01" value="0"><span class="val" id="val-state-wateringEffectStrength">0.00</span></div>

    <h3>🎬 Interaction</h3>
    <div class="ctrl-row"><label>Show Rain</label><input type="checkbox" id="inter-showRain"></div>
    <div class="ctrl-row"><label>Just Watered</label><input type="checkbox" id="inter-justWatered"></div>

    <h3>📐 Preview</h3>
    <div class="stats-grid" id="statsGrid"></div>
  </div>

  <div id="svg-container">
    <div class="dna-badge" id="dnaBadge">DEMO</div>
    <svg id="gardenSvg" viewBox="0 0 720 460" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════
//  Core Algorithms (faithful to src/garden/)
// ═══════════════════════════════════════════════

function hashSeed(value) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < value.length; i += 1) {
    h ^= value.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function createPrng(seed) {
  let a = typeof seed === 'string' ? hashSeed(seed) : seed >>> 0;
  return function() {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function noise1D(x, seed) {
  const lo = Math.floor(x);
  const hi = lo + 1;
  const r0 = createPrng(seed + ':' + lo)();
  const r1 = createPrng(seed + ':' + hi)();
  const t = x - lo;
  const smooth = t * t * (3 - 2 * t);
  return r0 * (1 - smooth) + r1 * smooth;
}

const TERRAINS = ['bosque', 'pradera', 'colina', 'monastico', 'mediterraneo'];
const PATHS = ['recto', 'curvo', 'espiral', 'cruz', 'circulo'];
const TREES = ['olivo', 'cedro', 'cipres', 'roble', 'sauce'];
const PALETTES = ['variante A', 'variante B', 'variante C'];
const FLOWER_BIAS = ['rosas', 'lirios', 'variado'];
const SEASONS = ['advent', 'christmas', 'lent', 'easter', 'pentecost', 'ordinary'];

function deriveDnaTraits(dna) {
  const seg = function(hex, start, len) {
    len = len || 4;
    return parseInt(hex.slice(start, start + len) || '0', 16) || 0;
  };
  return {
    dna: dna,
    terrain: TERRAINS[seg(dna, 0) % TERRAINS.length],
    pathShape: PATHS[seg(dna, 4) % PATHS.length],
    treeSpecies: TREES[seg(dna, 8) % TREES.length],
    rockPattern: seg(dna, 12) % 4,
    riverAngle: seg(dna, 16) % 360,
    paletteVariant: seg(dna, 20) % 3,
    flowerSpeciesBias: seg(dna, 24) % 3,
    signatureSeed: dna.slice(28, 44) || dna,
  };
}

function resolveLevel(level) {
  const l = Math.max(0, level);
  const REGISTRY = {
    1: { flowerBonus: 2, lightBonus: 1, plantBonus: 1, rockBonus: 0, particleBonus: 0, butterflyBonus: 0, lightRayBonus: 0 },
    2: { flowerBonus: 3, lightBonus: 1, plantBonus: 2, rockBonus: 1, particleBonus: 0, butterflyBonus: 0, lightRayBonus: 0 },
    3: { flowerBonus: 4, lightBonus: 2, plantBonus: 3, rockBonus: 1, particleBonus: 0, butterflyBonus: 0, lightRayBonus: 0 },
    4: { flowerBonus: 5, lightBonus: 2, plantBonus: 4, rockBonus: 2, particleBonus: 1, butterflyBonus: 0, lightRayBonus: 0 },
    5: { flowerBonus: 6, lightBonus: 3, plantBonus: 5, rockBonus: 2, particleBonus: 1, butterflyBonus: 1, lightRayBonus: 1 },
    6: { flowerBonus: 7, lightBonus: 3, plantBonus: 6, rockBonus: 3, particleBonus: 1, butterflyBonus: 1, lightRayBonus: 1 },
    7: { flowerBonus: 8, lightBonus: 4, plantBonus: 7, rockBonus: 3, particleBonus: 2, butterflyBonus: 1, lightRayBonus: 1 },
    8: { flowerBonus: 9, lightBonus: 4, plantBonus: 8, rockBonus: 4, particleBonus: 2, butterflyBonus: 2, lightRayBonus: 1 },
    9: { flowerBonus: 10, lightBonus: 5, plantBonus: 9, rockBonus: 4, particleBonus: 2, butterflyBonus: 2, lightRayBonus: 1 },
    10: { flowerBonus: 12, lightBonus: 5, plantBonus: 10, rockBonus: 5, particleBonus: 3, butterflyBonus: 2, lightRayBonus: 2 },
  };
  const config = { flowerBonus: 0, lightBonus: 0, plantBonus: 0, rockBonus: 0, particleBonus: 0, butterflyBonus: 0, lightRayBonus: 0 };
  for (let i = 1; i <= l; i++) {
    const mod = REGISTRY[i];
    if (mod) {
      config.flowerBonus += mod.flowerBonus;
      config.lightBonus += mod.lightBonus;
      config.plantBonus += mod.plantBonus;
      config.rockBonus += mod.rockBonus;
      config.particleBonus += mod.particleBonus;
      config.butterflyBonus += mod.butterflyBonus;
      config.lightRayBonus += mod.lightRayBonus;
    }
  }
  return config;
}

function clampCount(value, max) {
  return Math.max(0, Math.min(value, max));
}

function makePoints(rng, key, count, box) {
  return Array.from({ length: count }, function(_, i) {
    return {
      id: key + '-' + i,
      x: box.x0 + rng() * (box.x1 - box.x0),
      y: box.y0 + rng() * (box.y1 - box.y0),
      scale: 0.7 + rng() * 0.65,
      tone: Math.floor(rng() * 4),
      delay: rng() * 4,
    };
  }).sort(function(a, b) { return a.y - b.y; });
}

function fullTreeStructure(rng, x, y, length, maxDepth, angle, depth, out) {
  if (depth <= 0) return out || [];
  x = x || 0; y = y || 0; length = length || 46; maxDepth = maxDepth || 6;
  angle = angle || Math.PI / 2; depth = depth || maxDepth; out = out || [];
  var x2 = x + Math.cos(angle) * length;
  var y2 = y - Math.sin(angle) * length;
  var bend = (rng() - 0.5) * 9;
  out.push({
    d: 'M ' + x.toFixed(1) + ' ' + y.toFixed(1) + ' Q ' + ((x + x2) / 2 + bend).toFixed(1) + ' ' + ((y + y2) / 2).toFixed(1) + ' ' + x2.toFixed(1) + ' ' + y2.toFixed(1),
    width: Math.max(0.8, depth * 1.2),
    depth: maxDepth - depth,
    x1: x2, y1: y2, angle: angle,
  });
  fullTreeStructure(rng, x2, y2, length * 0.71, maxDepth, angle - 0.47 - rng() * 0.13, depth - 1, out);
  fullTreeStructure(rng, x2, y2, length * 0.68, maxDepth, angle + 0.44 + rng() * 0.13, depth - 1, out);
  return out;
}

function buildIsometricTerrain(traits) {
  var rng = createPrng(traits.dna + ':iso-terrain');
  var layers = [];
  var baseY = 448;
  var layerHeight = 34;
  var totalLayers = 9;
  var grassGreens = ['#1e5c1a', '#246e1f', '#2a8024', '#32922a', '#3ca430', '#48b636', '#54c83c', '#60da42', '#6cec48'];
  for (var i = 0; i < totalLayers; i++) {
    var progress = i / (totalLayers - 1);
    var noise = noise1D(i * 0.7, traits.dna + ':terrain-layer-' + i) * 10;
    var y = baseY - i * layerHeight + noise;
    var halfWidth = 220 - progress * 80 + noise1D(i * 0.3, traits.dna + ':terrain-w-' + i) * 10;
    var bevel = 5 + progress * 6;
    var leftX = 360 - halfWidth;
    var rightX = 360 + halfWidth;
    var shade = Math.round(160 + progress * 70);
    var fill = grassGreens[i % grassGreens.length];
    layers.push({
      id: 'terrain-' + i,
      d: 'M ' + leftX.toFixed(1) + ' ' + y.toFixed(1) + ' L ' + rightX.toFixed(1) + ' ' + y.toFixed(1) + ' L ' + (rightX + bevel).toFixed(1) + ' ' + (y + layerHeight).toFixed(1) + ' L ' + (leftX - bevel).toFixed(1) + ' ' + (y + layerHeight).toFixed(1) + ' Z',
      fill: fill,
      highlight: 'rgb(' + Math.min(255, shade + 50) + ',' + Math.min(255, shade + 40) + ',' + Math.min(255, shade + 30) + ')',
      stroke: 'rgb(' + Math.max(20, shade - 25) + ',' + Math.max(25, shade - 20) + ',' + Math.max(20, shade - 28) + ')',
      strokeWidth: 0.5,
    });
  }
  return layers;
}

function buildIsometricPond(traits, state) {
  var rng = createPrng(traits.dna + ':pond');
  var cx = 580 + rng() * 30;
  var cy = 350 + rng() * 20;
  var width = 70 + rng() * 35;
  var height = 28 + rng() * 18;
  var d = 'M ' + cx + ' ' + (cy - height) + ' C ' + (cx + width * 0.3) + ' ' + (cy - height * 1.5) + ', ' + (cx + width) + ' ' + (cy - height * 0.4) + ', ' + (cx + width * 0.7) + ' ' + cy + ' C ' + (cx + width * 0.4) + ' ' + (cy + height * 1.2) + ', ' + (cx - width * 0.2) + ' ' + (cy + height * 1.4) + ', ' + (cx - width * 0.3) + ' ' + (cy + height * 0.4) + ' C ' + (cx - width) + ' ' + (cy + height * 0.1) + ', ' + (cx - width * 0.6) + ' ' + (cy - height) + ', ' + cx + ' ' + (cy - height) + ' Z';
  var deepD = 'M ' + (cx + 6) + ' ' + (cy - 6) + ' C ' + (cx + width * 0.2) + ' ' + (cy - height * 0.9) + ', ' + (cx + width * 0.5) + ' ' + (cy - height * 0.2) + ', ' + (cx + width * 0.3) + ' ' + (cy + 3) + ' C ' + (cx + width * 0.1) + ' ' + (cy + height * 0.7) + ', ' + (cx - width * 0.1) + ' ' + (cy + height * 0.8) + ', ' + (cx - width * 0.1) + ' ' + (cy + 3) + ' C ' + (cx - width * 0.3) + ' ' + (cy - height * 0.3) + ', ' + (cx + width * 0.1) + ' ' + (cy - height * 0.5) + ', ' + (cx + 6) + ' ' + (cy - 6) + ' Z';
  var rippleCount = 4 + Math.floor(state.waterLevel / 20);
  var ripples = Array.from({ length: rippleCount }, function(_, i) {
    return { x: cx + (rng() - 0.5) * width * 0.5, y: cy + (rng() - 0.5) * height * 0.4, rx: 8 + i * 7, ry: 4 + i * 3, delay: rng() * 3 };
  });
  var lilyCount = 1 + Math.floor(state.waterLevel / 30);
  var lilies = Array.from({ length: lilyCount }, function() {
    return { x: cx + (rng() - 0.5) * width * 0.55, y: cy + (rng() - 0.5) * height * 0.35, scale: 0.5 + rng() * 0.5 };
  });
  var lotusCount = Math.min(3, 1 + Math.floor(state.totalWaterings / 8));
  var lotus = Array.from({ length: lotusCount }, function() {
    return { x: cx + (rng() - 0.5) * width * 4, y: cy + (rng() - 0.5) * height * 0.3, scale: 0.6 + rng() * 0.7, color: rng() > 0.5 ? '#f5c6d6' : '#f0e68c' };
  });
  var stones = Array.from({ length: 2 + Math.floor(rng() * 3) }, function() {
    return { x: cx + (rng() - 0.5) * width * 0.7, y: cy + (rng() - 0.5) * height * 0.5, scale: 0.4 + rng() * 0.5 };
  });
  var koiColors = ['#e8742a', '#f5b842', '#f0f0f0', '#d94e3a'];
  var koi = Array.from({ length: 2 + Math.floor(rng() * 2) }, function(_, i) {
    var kx = cx - width * 0.3 + rng() * width * 0.6;
    var ky = cy - height * 0.2 + rng() * height * 0.4;
    var angle = rng() * Math.PI * 2;
    var len = 10 + rng() * 16;
    return { x: kx, y: ky, length: len, angle: angle, color: koiColors[Math.floor(rng() * koiColors.length)], delay: rng() * 4 + i * 1.5 };
  });
  return {
    d: d, deepD: deepD, fill: 'url(#water-iso)', stroke: '#3a7a8a',
    ripples: ripples, lilies: lilies, lotus: lotus, stones: stones, koi: koi,
    visible: state.waterLevel > 10 || state.totalWaterings > 0,
  };
}

function buildCedarTree(traits, state) {
  var historyTotal = state.totalRosaries * 1.2 + state.totalNovenas * 3 + state.totalCoronillas * 1.5 + state.streak * 0.6 + state.totalWaterings * 0.2;
  var rng = createPrng(traits.dna + ':cedar');
  var x = 290 + rng() * 60;
  var y = 390;
  var trunkHeight = 60 + Math.min(50, historyTotal * 0.4);
  var canopyScale = 1 + Math.min(0.6, historyTotal / 100);
  var trunkBranches = [
    { d: 'M ' + (x - 10) + ' ' + y + ' L ' + (x - 8) + ' ' + (y - trunkHeight), width: 10, depth: 0, x1: x - 8, y1: y - trunkHeight, angle: Math.PI / 2 },
    { d: 'M ' + (x + 9) + ' ' + y + ' L ' + (x + 8) + ' ' + (y - trunkHeight), width: 9, depth: 0, x1: x + 8, y1: y - trunkHeight, angle: Math.PI / 2 },
  ];
  var barkTex = Array.from({ length: 14 }, function(_, i) {
    var t = i / 14;
    var bx = x - 8 + rng() * 16;
    var by = y - trunkHeight * t * 0.6;
    return {
      d: 'M ' + bx.toFixed(1) + ' ' + by.toFixed(1) + ' Q ' + (bx + (rng() - 0.5) * 7).toFixed(1) + ' ' + (by + 7).toFixed(1) + ' ' + (bx + (rng() - 0.5) * 5).toFixed(1) + ' ' + (by + 14).toFixed(1),
      width: 0.9 + rng() * 0.6,
      depth: Math.floor(t * 4),
      x1: bx, y1: by,
      angle: Math.PI / 2 + (rng() - 0.5) * 0.4,
    };
  });
  var roots = Array.from({ length: 8 + Math.floor(rng() * 5) }, function(_, i) {
    var baseAngle = -Math.PI / 2 + (i - 4) * 0.55;
    var angle = baseAngle + (rng() - 0.5) * 0.4;
    var len = 30 + rng() * 50;
    var ex = x + Math.cos(angle) * len;
    var ey = y + Math.sin(angle) * len * 0.4 + 10;
    return {
      d: 'M ' + x + ' ' + y + ' Q ' + (x + Math.cos(angle) * len * 0.5).toFixed(1) + ' ' + (y + Math.sin(angle) * len * 0.2 + 5).toFixed(1) + ' ' + ex.toFixed(1) + ' ' + ey.toFixed(1),
      stroke: rng() > 0.5 ? '#5a4a32' : '#6b5a42',
      strokeWidth: 1.5 + rng() * 2.5,
    };
  });
  var canopyBaseY = y - trunkHeight - 3;
  function makeCanopy(scaleY, shrink, color, highlight, opacity) {
    var cy = canopyBaseY - 30 * canopyScale * scaleY;
    var sx = 48 * canopyScale * shrink;
    var sy = 32 * canopyScale * shrink;
    var sx2 = 52 * canopyScale * shrink;
    var sy2 = 20 * canopyScale * shrink;
    return {
      d: 'M ' + x + ' ' + (cy - 38 * canopyScale * scaleY).toFixed(1) + ' C ' + (x - sx).toFixed(1) + ' ' + (cy - 12 * canopyScale * scaleY).toFixed(1) + ', ' + (x - sx2).toFixed(1) + ' ' + (cy + sy2).toFixed(1) + ', ' + (x - sx * 0.7).toFixed(1) + ' ' + (cy + sy).toFixed(1) + ' C ' + (x - sx * 0.3).toFixed(1) + ' ' + (cy + sy * 1.15).toFixed(1) + ', ' + (x + sx * 0.3).toFixed(1) + ' ' + (cy + sy * 1.15).toFixed(1) + ', ' + (x + sx * 0.7).toFixed(1) + ' ' + (cy + sy).toFixed(1) + ' C ' + (x + sx2).toFixed(1) + ' ' + (cy + sy2).toFixed(1) + ', ' + (x + sx).toFixed(1) + ' ' + (cy - 12 * canopyScale * scaleY).toFixed(1) + ', ' + x + ' ' + (cy - 38 * canopyScale * scaleY).toFixed(1) + ' Z',
      fill: color, highlight: highlight, opacity: opacity,
    };
  }
  var canopyLayers = [
    makeCanopy(1.0, 1.0, '#355e28', '#4a8a3a', 0.92),
    makeCanopy(0.92, 0.92, '#3d7230', '#52914a', 0.88),
    makeCanopy(0.84, 0.84, '#468638', '#60a052', 0.85),
    makeCanopy(0.76, 0.76, '#509a40', '#72b864', 0.81),
    makeCanopy(0.68, 0.68, '#5aad48', '#88cc78', 0.77),
  ];
  var goldenPatches = Array.from({ length: 3 + Math.floor(rng() * 3) }, function(_, i) {
    var px = x + (rng() - 0.5) * 30 * canopyScale;
    var py = canopyBaseY - 20 * canopyScale - rng() * 30 * canopyScale;
    var rx = 6 + rng() * 8;
    var ry = 4 + rng() * 5;
    return {
      d: 'M ' + px + ' ' + py + ' C ' + (px + rx) + ' ' + (py - ry) + ', ' + (px + rx * 1.5) + ' ' + (py + ry) + ', ' + px + ' ' + (py + ry * 1.2) + ' C ' + (px - rx) + ' ' + (py - ry * 0.5) + ', ' + (px - rx * 1.2) + ' ' + (py + ry * 0.8) + ', ' + px + ' ' + py + ' Z',
      fill: '#f5e6b8',
      opacity: 0.25 + rng() * 0.2,
    };
  });
  return {
    species: traits.treeSpecies, x: x, y: y, trunkHeight: trunkHeight, canopyScale: canopyScale,
    branches: trunkBranches.concat(barkTex), visibleDepth: 5,
    cedarExtras: { roots: roots, canopyLayers: canopyLayers, goldenPatches: goldenPatches },
  };
}

function buildCentralTree(traits, state) {
  var historyTotal = state.totalRosaries * 1.2 + state.totalNovenas * 3 + state.totalCoronillas * 1.5 + state.streak * 0.6 + state.totalWaterings * 0.2;
  var rng = createPrng(traits.dna + ':tree');
  var x = 360 + (rng() - 0.5) * 20;
  var y = 322;
  var trunkHeight = 44 + Math.min(36, historyTotal * 0.42);
  var canopyScale = 1 + Math.min(0.6, historyTotal / 120);
  var branches = fullTreeStructure(createPrng(traits.dna + ':tree-struct'), x, y, 46, 6, Math.PI / 2, 6);
  return {
    species: traits.treeSpecies, x: x, y: y, trunkHeight: trunkHeight, canopyScale: canopyScale,
    branches: branches, visibleDepth: Math.min(6, Math.max(2, Math.floor(2 + historyTotal / 10))),
  };
}

function buildFloraClusters(traits, state) {
  var rng = createPrng(traits.dna + ':flora');
  var clusters = [];
  var baseTypes = ['lavender', 'daisy', 'rosemary', 'thyme', 'olive_shrub'];
  var baseBudget = Math.min(26, 6 + Math.floor(state.totalSeeds / 5) + Math.floor(state.totalSilenceMinutes / 10));
  var devotionBaseRose = Math.floor(state.totalRosaries / 2);
  var devotionBaseWreath = Math.floor(state.totalCoronillas / 3);
  var devotionBaseLily = Math.floor(state.totalNovenas / 2);
  var effectiveRoseBase = state.consolidatedRosal ? 0 : devotionBaseRose;
  var roseBudget = Math.min(5, effectiveRoseBase);
  var wreathBudget = Math.min(4, devotionBaseWreath);
  var lilyBudget = Math.min(4, devotionBaseLily);
  var isFase1 = state.growthPhase === 1;
  var isFase2 = state.growthPhase === 2;
  var isFase3 = state.growthPhase === 3;
  var phaseRoseBudget = isFase1 ? 0 : isFase2 ? Math.min(3, effectiveRoseBase) : roseBudget;
  var phaseWreathBudget = isFase1 ? 0 : isFase2 ? Math.min(2, devotionBaseWreath) : wreathBudget;
  var phaseLilyBudget = isFase1 ? 0 : isFase2 ? Math.min(2, devotionBaseLily) : lilyBudget;
  var totalBudget = Math.min(26, phaseRoseBudget + phaseWreathBudget + phaseLilyBudget + baseBudget);
  var typeBag = [];
  for (var r = 0; r < phaseRoseBudget; r++) typeBag.push('rose');
  for (var r = 0; r < phaseWreathBudget; r++) typeBag.push('floral_wreath');
  for (var r = 0; r < phaseLilyBudget; r++) typeBag.push('lily');
  while (typeBag.length < totalBudget) typeBag.push(baseTypes[Math.floor(rng() * baseTypes.length)]);
  typeBag.sort(function() { return rng() - 0.5; });
  var nodeRng = createPrng(traits.dna + ':nodes');
  var sacredNodes = [];
  if (isFase2 || isFase3) {
    var nodeCount = isFase2 ? 2 : 4;
    for (var i = 0; i < nodeCount; i++) {
      var along = (i + 1) / (nodeCount + 1);
      sacredNodes.push({
        x: 200 + along * 320 + (nodeRng() - 0.5) * 30,
        y: 355 + along * 50 + (nodeRng() - 0.5) * 15,
        type: nodeRng() > 0.5 ? 'cross' : 'stone_altar',
        scale: 0.6 + nodeRng() * 0.3,
      });
    }
  }
  var exclude = new Set();
  for (var i = 0; i < totalBudget; i++) {
    var type = typeBag[i] || baseTypes[Math.floor(rng() * baseTypes.length)];
    var posRng = createPrng(traits.dna + ':flora-pos-' + i);
    var cx = 200 + posRng() * 280;
    var cy = 325 + posRng() * 80;
    if (exclude.has(type + '-' + cx.toFixed(0) + '-' + cy.toFixed(0))) continue;
    var clusterRng = createPrng(traits.dna + ':flora-dew-' + i);
    var dewPoints = state.wateringEffectStrength > 0.05
      ? Array.from({ length: 2 + Math.floor(clusterRng() * 2) }, function(_, j) {
          return { dx: (clusterRng() - 0.5) * 18, dy: -12 - clusterRng() * 22, r: 0.4 + clusterRng() * 0.5, opacity: (0.35 + clusterRng() * 0.35) * state.wateringEffectStrength };
        })
      : undefined;
    clusters.push({
      id: 'flora-' + i, x: cx, y: cy, type: type,
      scale: 0.6 + rng() * 0.7, tone: Math.floor(rng() * 4), delay: rng() * 5,
      rotation: rng() * 360,
      dewPoints: dewPoints,
      wateringEffectStrength: state.wateringEffectStrength,
    });
  }
  if (state.consolidatedRosal) {
    var rng2 = createPrng(traits.dna + ':rosal-gracia');
    clusters.push({
      id: 'rosal-de-gracia-' + clusters.length,
      x: 360 + (rng2() - 0.5) * 160,
      y: 340 + rng2() * 30,
      type: 'rosal_de_gracia',
      scale: 1.2 + rng2() * 0.4,
      tone: Math.floor(rng2() * 4),
      delay: rng2() * 5,
      rotation: rng2() * 30 - 15,
    });
  }
  return { clusters: clusters, sacredNodes: sacredNodes };
}

function buildDove(traits, state) {
  if (!state.showDove) return undefined;
  var rng = createPrng(traits.dna + ':dove');
  return { x: 340 + rng() * 40, y: 250 + rng() * 30, scale: 0.7 + rng() * 0.3 };
}

function buildDeer(traits, state) {
  if (!state.showDeer || !traits.riverAngle) return undefined;
  var rng = createPrng(traits.dna + ':deer');
  return { x: 120 + rng() * 80, y: 390 + rng() * 20, scale: 0.6 + rng() * 0.3, angle: (rng() - 0.5) * 20 };
}

function buildShadows(elements, health) {
  var softness = Math.max(0, Math.min(1, health));
  return elements.map(function(el) {
    return {
      x: (el.x || 0) + 4,
      y: (el.y || 0) + 3,
      rx: 14 + 2 * softness,
      ry: 6 + 2 * softness,
      opacity: 0.22 - 0.06 * softness,
    };
  });
}

function signatureFromDna(traits) {
  var rng = createPrng(traits.signatureSeed + ':signature');
  var kinds = ['leaf', 'flower', 'branch', 'star'];
  return {
    kind: kinds[Math.floor(rng() * kinds.length)],
    hue: 65 + Math.floor(rng() * 65),
    angle: -24 + Math.floor(rng() * 48),
    petals: 4 + Math.floor(rng() * 4),
    code: Math.floor(rng() * 65535),
  };
}

function generateGardenModel(traits, state) {
  var levelConfig = resolveLevel(state.level);
  var tree = traits.treeSpecies === 'cedro' ? buildCedarTree(traits, state) : buildCentralTree(traits, state);
  var lightCount = Math.min(14, Math.floor(state.totalCoronillas * 1.2) + Math.floor(state.streak / 8)) + levelConfig.lightBonus;
  var flowerCount = Math.min(24, Math.floor(state.totalCoronillas * 1.5)) + Math.min(10, Math.floor(state.totalSilenceMinutes / 15)) + levelConfig.flowerBonus;
  var stoneCount = Math.min(14, 3 + state.totalNovenas * 2 + traits.rockPattern) + levelConfig.rockBonus;
  var smallVegCount = Math.min(34, 6 + Math.floor(state.totalSeeds * 0.7) + Math.floor(state.totalSilenceMinutes / 5) + levelConfig.plantBonus);
  var terrainLayers = buildIsometricTerrain(traits);
  var pond = buildIsometricPond(traits, state);
  var floraResult = buildFloraClusters(traits, state);
  var floraClusters = floraResult.clusters;
  var shadows = buildShadows(floraClusters, state.health);
  var dove = buildDove(traits, state);
  var deer = buildDeer(traits, state);
  var grottoRng = createPrng(traits.dna + ':grotto');
  var grottoArch = state.growthPhase === 3 ? {
    x: tree.x, width: 70 + grottoRng() * 40, height: 35 + grottoRng() * 25,
    pillarHang: 18 + grottoRng() * 18, vineCount: 3 + Math.floor(grottoRng() * 4),
    altarX: tree.x + (grottoRng() - 0.5) * 30, altarY: tree.y - 14,
    vineSeeds: Array.from({ length: 5 }, function() { return Math.floor(grottoRng() * 1000); }),
  } : undefined;
  var sacredGeometry = state.growthPhase === 3 ? (function() {
    var sgRng = createPrng(traits.dna + ':sacred-geometry');
    var cx = tree.x;
    var cy = tree.y - tree.trunkHeight * 0.35;
    var rx = 55 + sgRng() * 20;
    var ry = 28 + sgRng() * 12;
    var rotation = sgRng() * Math.PI;
    var nodeCount = 4;
    var nodes = [];
    for (var i = 0; i < nodeCount; i++) {
      var angle = rotation + (i / nodeCount) * Math.PI * 2;
      nodes.push({ x: cx + Math.cos(angle) * rx, y: cy + Math.sin(angle) * ry * 0.6 });
    }
    return { cx: cx, cy: cy, rx: rx, ry: ry, rotation: rotation, nodes: nodes };
  })() : undefined;
  var riverD = '';
  if (!pond || !pond.visible) {
    var rng = createPrng(traits.dna + ':river');
    var startX = 360 + (rng() - 0.5) * 100;
    var cp1x = startX + (rng() - 0.5) * 200;
    var cp1y = 300 + rng() * 100;
    var cp2x = startX + (rng() - 0.5) * 150;
    var cp2y = 200 + rng() * 80;
    var endX = startX + (rng() - 0.5) * 80;
    var endY = 100 + rng() * 50;
    riverD = 'M ' + startX + ' 460 C ' + cp1x + ' ' + cp1y + ', ' + cp2x + ' ' + cp2y + ', ' + endX + ' ' + endY;
  }
  return {
    terrain: 'M 0 460 L 0 314 C 180 286 520 296 720 266 L 720 460 Z',
    terrainLayers: terrainLayers,
    path: buildPath(traits),
    pathWidth: 32 + state.totalNovenas * 1.8,
    soilPath: buildSoilPath(traits),
    river: { d: riverD, visible: (state.waterLevel > 10 || state.totalWaterings > 0) && !(pond && pond.visible) },
    pond: pond,
    rocks: makePoints(createPrng(traits.dna + ':rocks'), 'rock', stoneCount, { x0: 160, x1: 560, y0: 330, y1: 420 }),
    ambientPlants: makePoints(createPrng(traits.dna + ':ambient-plants'), 'ambient-plant', clampCount(smallVegCount, 30), { x0: 160, x1: 560, y0: 320, y1: 434 }),
    ambientFlowers: makePoints(createPrng(traits.dna + ':ambient-flowers'), 'ambient-flower', clampCount(flowerCount, 24), { x0: 160, x1: 560, y0: 292, y1: 405 }),
    lights: makePoints(createPrng(traits.dna + ':lights'), 'light', clampCount(lightCount, 16), { x0: 180, x1: 540, y0: 280, y1: 380 }),
    tree: tree,
    butterflies: makePoints(createPrng(traits.dna + ':butterflies'), 'butterfly', Math.min(7, Math.floor(state.waterLevel / 15)) + levelConfig.butterflyBonus, { x0: 160, x1: 560, y0: 140, y1: 285 }),
    particles: makePoints(createPrng(traits.dna + ':particles'), 'particle', 20 + levelConfig.particleBonus, { x0: 160, x1: 560, y0: 70, y1: 350 }),
    lightRays: (function() {
      var lightRng = createPrng(traits.dna + ':light');
      return Array.from({ length: clampCount(Math.floor(state.communityPrayer / 2) + 2 + levelConfig.lightRayBonus, 7) }, function() {
        return { x: lightRng() * 720, width: 35 + lightRng() * 90, opacity: 0.04 + lightRng() * 0.07 };
      });
    })(),
    shadows: shadows,
    floraClusters: floraClusters,
    sacredNodes: floraResult.sacredNodes,
    dove: dove,
    deer: deer,
    grottoArch: grottoArch,
    sacredGeometry: sacredGeometry,
  };
}

function buildPath(traits) {
  switch (traits.pathShape) {
    case 'recto': return 'M 360 460 L 358 300';
    case 'espiral': return 'M 360 460 C 300 420, 420 400, 380 350 C 350 320, 400 300, 388 270';
    case 'cruz': return 'M 360 460 L 358 300 M 300 380 L 420 380';
    case 'circulo': return 'M 360 460 C 300 430, 300 350, 360 330 C 420 350, 420 430, 360 460';
    default: return 'M 378 460 C 330 410, 430 365, 360 325';
  }
}

function buildSoilPath(traits) {
  var rng = createPrng(traits.dna + ':soil');
  var cx = 360 + (rng() - 0.5) * 40;
  var baseY = 464;
  var cp1x = cx - 70 + rng() * 40;
  var cp1y = baseY - 120 - rng() * 40;
  var cp2x = cx + 60 + rng() * 40;
  var cp2y = baseY - 200 - rng() * 60;
  var endX = cx + (rng() - 0.5) * 30;
  var endY = baseY - 260 - rng() * 40;
  return 'M ' + cx + ' ' + baseY + ' C ' + cp1x + ' ' + cp1y + ', ' + cp2x + ' ' + cp2y + ', ' + endX + ' ' + endY;
}

var SVG_NS = 'http://www.w3.org/2000/svg';

function svgEl(tag, attrs, parent) {
  var el = document.createElementNS(SVG_NS, tag);
  if (attrs) {
    for (var k in attrs) {
      if (attrs.hasOwnProperty(k)) el.setAttribute(k, attrs[k]);
    }
  }
  if (parent) parent.appendChild(el);
  return el;
}

function clearSvg(svg) {
  while (svg.firstChild) svg.removeChild(svg.firstChild);
}

function renderGarden(svg, traits, state, showRain, justWatered) {
  clearSvg(svg);
  var model = generateGardenModel(traits, state);
  var signature = signatureFromDna(traits);
  var health = state.health;
  var saturate = 0.6 + 0.3 * health;
  var contentOpacity = 0.7 + 0.25 * health;
  var wateringBoost = Math.max(0, Math.min(1, state.wateringEffectStrength));
  var tree = model.tree;
  var showPond = model.pond && model.pond.visible;

  // Defs
  var defs = svgEl('defs', null, svg);
  var rawId = 'demo-' + Math.random().toString(36).slice(2, 8);

  // Sky gradient
  var skyGrad = svgEl('linearGradient', { id: 'sky-' + rawId, x1: '0', y1: '0', x2: '0', y2: '1' }, defs);
  svgEl('stop', { offset: '0', 'stop-color': '#b8d8ff' }, skyGrad);
  svgEl('stop', { offset: '0.45', 'stop-color': '#e8f4ff' }, skyGrad);
  svgEl('stop', { offset: '0.78', 'stop-color': '#fffbe6' }, skyGrad);
  svgEl('stop', { offset: '1', 'stop-color': '#ffe8c0' }, skyGrad);

  // Glow gradient
  var glowGrad = svgEl('radialGradient', { id: 'glow-' + rawId, cx: '50%', cy: '30%', r: '65%' }, defs);
  svgEl('stop', { offset: '0', 'stop-color': '#fff5d6', 'stop-opacity': String(0.6 + state.lightLevel / 250) }, glowGrad);
  svgEl('stop', { offset: '1', 'stop-color': '#fff5d6', 'stop-opacity': '0' }, glowGrad);

  // Canopy glow
  var canopyGlow = svgEl('radialGradient', { id: 'canopy-glow-' + rawId, cx: '50%', cy: '50%', r: '50%' }, defs);
  svgEl('stop', { offset: '0', 'stop-color': '#fff8dc', 'stop-opacity': '0.28' }, canopyGlow);
  svgEl('stop', { offset: '1', 'stop-color': '#fff8dc', 'stop-opacity': '0' }, canopyGlow);

  // Golden hour
  var goldenHour = svgEl('radialGradient', { id: 'golden-hour-' + rawId, cx: '50%', cy: '30%', r: '70%' }, defs);
  svgEl('stop', { offset: '0', 'stop-color': '#fff5d6', 'stop-opacity': '0.2' }, goldenHour);
  svgEl('stop', { offset: '1', 'stop-color': '#fff5d6', 'stop-opacity': '0' }, goldenHour);

  // Water gradients
  var waterGrad = svgEl('linearGradient', { id: 'water-' + rawId, x1: '0', y1: '0', x2: '0.3', y2: '1' }, defs);
  svgEl('stop', { offset: '0', 'stop-color': '#7ec8e3' }, waterGrad);
  svgEl('stop', { offset: '0.5', 'stop-color': '#4fa4c2' }, waterGrad);
  svgEl('stop', { offset: '1', 'stop-color': '#2d7a9e' }, waterGrad);

  var waterIsoGrad = svgEl('linearGradient', { id: 'water-iso-' + rawId, x1: '0', y1: '0', x2: '0.3', y2: '1' }, defs);
  svgEl('stop', { offset: '0', 'stop-color': '#a8dce8' }, waterIsoGrad);
  svgEl('stop', { offset: '0.5', 'stop-color': '#5cb8d0' }, waterIsoGrad);
  svgEl('stop', { offset: '1', 'stop-color': '#2d8aaa' }, waterIsoGrad);

  var waterIsoDeepGrad = svgEl('linearGradient', { id: 'water-iso-deep-' + rawId, x1: '0', y1: '0', x2: '1', y2: '1' }, defs);
  svgEl('stop', { offset: '0', 'stop-color': '#a8d8e8', 'stop-opacity': '0.45' }, waterIsoDeepGrad);
  svgEl('stop', { offset: '1', 'stop-color': '#3a7a9a', 'stop-opacity': '0.65' }, waterIsoDeepGrad);

  // Rose petal gradient
  var roseGrad = svgEl('linearGradient', { id: 'rose-petal-' + rawId, x1: '0', y1: '0', x2: '0', y2: '1' }, defs);
  svgEl('stop', { offset: '0', 'stop-color': '#ffb7c5' }, roseGrad);
  svgEl('stop', { offset: '0.55', 'stop-color': '#ff69b4' }, roseGrad);
  svgEl('stop', { offset: '1', 'stop-color': '#c71585' }, roseGrad);

  // Lily petal gradient
  var lilyGrad = svgEl('linearGradient', { id: 'lily-petal-' + rawId, x1: '0', y1: '0', x2: '0', y2: '1' }, defs);
  svgEl('stop', { offset: '0', 'stop-color': '#ffffff' }, lilyGrad);
  svgEl('stop', { offset: '0.65', 'stop-color': '#fffacd' }, lilyGrad);
  svgEl('stop', { offset: '1', 'stop-color': '#daa520' }, lilyGrad);

  // Soil path gradient
  var soilGrad = svgEl('linearGradient', { id: 'soil-path-' + rawId, x1: '0.5', y1: '0', x2: '0.5', y2: '1' }, defs);
  svgEl('stop', { offset: '0', 'stop-color': '#a0522d' }, soilGrad);
  svgEl('stop', { offset: '0.5', 'stop-color': '#8b4513' }, soilGrad);
  svgEl('stop', { offset: '1', 'stop-color': '#5c2e0a' }, soilGrad);

  // Bark gradient
  var barkGrad = svgEl('radialGradient', { id: 'bark-' + rawId, cx: '50%', cy: '50%', r: '50%' }, defs);
  svgEl('stop', { offset: '0', 'stop-color': '#7a6a52' }, barkGrad);
  svgEl('stop', { offset: '1', 'stop-color': '#4a3a22' }, barkGrad);

  // Lily glow
  var lilyGlow = svgEl('radialGradient', { id: 'lily-glow-' + rawId, cx: '50%', cy: '50%', r: '50%' }, defs);
  svgEl('stop', { offset: '0', 'stop-color': '#ffffff', 'stop-opacity': '0.4' }, lilyGlow);
  svgEl('stop', { offset: '1', 'stop-color': '#ffffff', 'stop-opacity': '0' }, lilyGlow);

  // Main group with filter
  var mainGroup = svgEl('g', { style: 'filter: saturate(' + saturate + '); opacity: ' + contentOpacity }, svg);

  // Sky
  svgEl('rect', { width: '720', height: '460', fill: 'url(#sky-' + rawId + ')', opacity: String(0.88 + 0.12 * health) }, mainGroup);
  svgEl('rect', { width: '720', height: '460', fill: 'url(#golden-hour-' + rawId + ')', pointerEvents: 'none' }, mainGroup);

  // Terrain layers
  var terrainGroup = svgEl('g', null, mainGroup);
  model.terrainLayers.forEach(function(layer, idx) {
    var y = 448 - idx * 34;
    var g = svgEl('g', null, terrainGroup);
    svgEl('path', { d: layer.d, fill: layer.fill, stroke: layer.stroke, 'stroke-width': String(layer.strokeWidth) }, g);
    svgEl('path', { d: 'M 140 ' + y + ' Q 360 ' + (y - 9) + ' 580 ' + y, fill: 'none', stroke: layer.highlight, 'stroke-width': '1.1', opacity: '0.45' }, g);
  });

  // Shadows
  var shadowGroup = svgEl('g', null, mainGroup);
  model.shadows.forEach(function(shadow, i) {
    svgEl('ellipse', { cx: String(shadow.x), cy: String(shadow.y), rx: String(shadow.rx || 14), ry: String(shadow.ry || 6), fill: 'rgba(40, 44, 24, 0.28)' }, shadowGroup);
  });

  // Water
  var waterGroup = svgEl('g', null, mainGroup);
  if (showPond && model.pond) {
    renderPond(waterGroup, model.pond, state.waterLevel, rawId);
  } else if (model.river.visible) {
    var riverG = svgEl('g', null, waterGroup);
    svgEl('path', { d: model.river.d, fill: 'url(#water-' + rawId + ')', opacity: String(0.6 + state.waterLevel / 280) }, riverG);
    svgEl('path', { d: model.river.d, fill: 'none', stroke: '#e0f0f5', 'stroke-width': '2.5', opacity: '0.55' }, riverG);
  }

  // Ambient plants
  var plantGroup = svgEl('g', null, mainGroup);
  model.ambientPlants.filter(function(p) { return isFinite(p.x) && isFinite(p.y); }).forEach(function(plant) {
    renderPlant(plantGroup, plant, '#3d8b40', wateringBoost);
  });

  // Ambient flowers
  var flowerGroup = svgEl('g', null, mainGroup);
  model.ambientFlowers.filter(function(f) { return isFinite(f.x) && isFinite(f.y); }).forEach(function(flower) {
    var colors = ['#ff69b4', '#da70d6', '#87ceeb', '#ffd700'];
    renderFlower(flowerGroup, flower, colors[flower.tone % 4], wateringBoost);
  });

  // Flora clusters
  var clusterGroup = svgEl('g', null, mainGroup);
  model.floraClusters.forEach(function(cluster) {
    renderFloraCluster(clusterGroup, cluster, rawId);
  });

  // Fauna
  var faunaGroup = svgEl('g', null, mainGroup);
  if (model.deer) renderDeer(faunaGroup, model.deer);
  if (model.dove) renderDove(faunaGroup, model.dove);

  // Butterflies
  model.butterflies.filter(function(b) { return isFinite(b.x) && isFinite(b.y); }).forEach(function(butterfly, idx) {
    var bg = svgEl('g', null, faunaGroup);
    svgEl('ellipse', { cx: '-4.5', cy: '0', rx: '5.2', ry: '3.2', fill: '#ff6b9d', transform: 'rotate(28)', opacity: '0.92' }, bg);
    svgEl('ellipse', { cx: '4.5', cy: '0', rx: '5.2', ry: '3.2', fill: '#c71585', transform: 'rotate(-28)', opacity: '0.88' }, bg);
    svgEl('ellipse', { cx: '0', cy: '0', rx: '2', ry: '1.1', fill: '#1a050a' }, bg);
  });

  // Particles
  var particleGroup = svgEl('g', null, mainGroup);
  model.particles.filter(function(p) { return p.x != null && p.y != null && isFinite(p.x) && isFinite(p.y); }).forEach(function(particle) {
    var pg = svgEl('g', null, particleGroup);
    svgEl('circle', { cx: '0', cy: '0', r: String(Math.max(0.5, 1 + (particle.scale || 0) * 1.3)), fill: '#ffd700' }, pg);
  });

  // Sacred nodes
  if (model.sacredNodes) {
    var sacredGroup = svgEl('g', null, mainGroup);
    model.sacredNodes.forEach(function(node, idx) {
      var sg = svgEl('g', { transform: 'translate(' + node.x + ' ' + node.y + ') scale(' + node.scale + ')' }, sacredGroup);
      if (node.type === 'cross') {
        svgEl('line', { x1: '0', y1: '6', x2: '0', y2: '-6', stroke: '#6b6b6b', 'stroke-width': '1.4', 'stroke-linecap': 'round' }, sg);
        svgEl('line', { x1: '-3.5', y1: '-2', x2: '3.5', y2: '-2', stroke: '#6b6b6b', 'stroke-width': '1.2', 'stroke-linecap': 'round' }, sg);
      } else {
        svgEl('rect', { x: '-4', y: '-2', width: '8', height: '4', fill: '#7a7a72', rx: '1' }, sg);
        svgEl('rect', { x: '-3.5', y: '-3.5', width: '7', height: '1.5', fill: '#8a8a82', rx: '0.8' }, sg);
      }
    });
  }

  // Grotto arch
  if (model.grottoArch) {
    renderGrottoArch(mainGroup, model.grottoArch, tree);
  }

  // Sacred geometry
  if (model.sacredGeometry) {
    renderSacredGeometry(mainGroup, model.sacredGeometry);
  }

  // Lights
  var lightsGroup = svgEl('g', null, mainGroup);
  model.lights.forEach(function(light) {
    var lg = svgEl('g', null, lightsGroup);
    svgEl('circle', { cx: String(light.x), cy: String(light.y), r: '2.8', fill: '#fff5d6' }, lg);
    svgEl('circle', { cx: String(light.x), cy: String(light.y), r: '7.5', fill: '#ffd700', opacity: '0.16' }, lg);
  });

  // Central tree
  var treeGroup = svgEl('g', { transform: 'translate(' + tree.x + ' ' + tree.y + ')' }, mainGroup);
  renderCentralTree(treeGroup, tree, justWatered, rawId);

  // Robin
  var robinX = tree.x - 25;
  var robinY = tree.y - tree.trunkHeight * 0.7;
  renderRobin(mainGroup, robinX, robinY);

  // Canopy glow
  svgEl('ellipse', { cx: String(tree.x), cy: String(tree.y - tree.trunkHeight * 0.35), rx: String(60 * (tree.canopyScale || 1)), ry: String(40 * (tree.canopyScale || 1)), fill: 'url(#canopy-glow-' + rawId + ')' }, mainGroup);

  // Light rays
  var raysGroup = svgEl('g', null, mainGroup);
  model.lightRays.forEach(function(ray, i) {
    svgEl('path', { d: 'M ' + ray.x + ' 0 L ' + (ray.x + ray.width) + ' 400 L ' + (ray.x - ray.width / 2) + ' 400 Z', fill: '#fff5d6', opacity: String(ray.opacity) }, raysGroup);
  });

  // Rain
  if (showRain) {
    var rainGroup = svgEl('g', null, mainGroup);
    for (var ri = 0; ri < 28; ri++) {
      svgEl('line', { x1: String(40 + ri * 24), y1: '0', x2: String(34 + ri * 24), y2: '460', stroke: '#a8c8d8', 'stroke-width': '1.3', opacity: '0.4' }, rainGroup);
    }
  }

  // Just watered effect
  if (justWatered) {
    svgEl('circle', { cx: '360', cy: '322', r: '20', fill: 'none', stroke: '#7ec8e3', 'stroke-width': '2' }, mainGroup);
  }

  // Drought overlay
  if (health < 0.25) {
    svgEl('rect', { x: '0', y: '0', width: '720', height: '460', fill: '#8a7e6b', opacity: String(0.14 * (1 - health / 0.3)), pointerEvents: 'none' }, mainGroup);
  }

  // Dew points
  if (state.wateringEffectStrength > 0.05) {
    var dewGroup = svgEl('g', null, mainGroup);
    var dewPoints = [
      { x: 360, y: 360, r: 120, opacity: 0.12 * state.wateringEffectStrength },
      { x: 260, y: 310, r: 80, opacity: 0.08 * state.wateringEffectStrength },
      { x: 460, y: 320, r: 90, opacity: 0.09 * state.wateringEffectStrength },
    ];
    dewPoints.forEach(function(dp) {
      svgEl('circle', { cx: String(dp.x), cy: String(dp.y), r: String(dp.r), fill: 'none', stroke: '#ffffff', 'stroke-width': '0.5', opacity: String(dp.opacity) }, dewGroup);
    });
  }

  // Signature block
  var sigGroup = svgEl('g', { transform: 'translate(640 420)' }, svg);
  renderStonePlaque(sigGroup);
  var sigInner = svgEl('g', { transform: 'translate(0, 28)' }, sigGroup);
  renderSignatureGlyph(sigInner, signature);

  // DNA badge
  var badge = document.getElementById('dnaBadge');
  if (badge) {
    badge.textContent = (traits.dna || 'demo').slice(0, 10).toUpperCase() + ' · ' + traits.terrain + ' · ' + traits.treeSpecies;
  }
}

function renderPond(parent, pond, waterLevel, rawId) {
  var pg = svgEl('g', null, parent);
  svgEl('path', { d: pond.d, fill: 'url(#water-iso-' + rawId + ')', opacity: '0.92' }, pg);
  svgEl('path', { d: pond.deepD, fill: 'url(#water-iso-deep-' + rawId + ')' }, pg);
  svgEl('path', { d: pond.d, fill: 'none', stroke: '#a8e6cf', 'stroke-width': '1.6', opacity: '0.4' }, pg);

  pond.stones.forEach(function(stone, i) {
    var sg = svgEl('g', { transform: 'translate(' + stone.x + ' ' + stone.y + ') scale(' + stone.scale + ')' }, pg);
    svgEl('path', { d: 'M0 0 Q4 -3 8 0 Q4 -5 0 0Z', fill: '#8a8a7a', opacity: '0.75' }, sg);
    svgEl('path', { d: 'M0 0 Q-3 -2 -6 0 Q-3 -4 0 0Z', fill: '#6a6a5a', opacity: '0.55' }, sg);
  });

  pond.lilies.forEach(function(lily, i) {
    var lg = svgEl('g', { transform: 'translate(' + lily.x + ' ' + lily.y + ') scale(' + lily.scale + ')' }, pg);
    svgEl('ellipse', { cx: '0', cy: '1.5', rx: '6', ry: '3.2', fill: '#4a9a4a', opacity: '0.95' }, lg);
    svgEl('path', { d: 'M-5.5 1.5 Q0 -2.5 5.5 1.5 Q3 5.5 -5.5 1.5Z', fill: '#7ac87a', opacity: '0.9' }, lg);
    svgEl('circle', { cx: '0', cy: '0.5', r: '1.5', fill: '#ffb7c5', opacity: '0.95' }, lg);
  });

  pond.lotus.forEach(function(lotus, i) {
    var lg = svgEl('g', { transform: 'translate(' + lotus.x + ' ' + lotus.y + ') scale(' + lotus.scale + ')' }, pg);
    svgEl('ellipse', { cx: '0', cy: '1', rx: '7.5', ry: '3.8', fill: '#3d8b3d', opacity: '0.95' }, lg);
    for (var p = 0; p < 5; p++) {
      var sign = p % 2 === 0 ? -1.2 : 1.2;
      svgEl('path', {
        d: 'M0 1 Q' + (sign * 3.5) + ' ' + (-5 - p * 1.2) + ' 0 ' + (-11 - p * 1.8) + ' Q' + (sign * 3.5) + ' ' + (-5 - p * 1.2) + ' 0 1Z',
        fill: lotus.color, opacity: '0.92',
        transform: 'rotate(' + (p * 28) + ' 0 1)',
      }, lg);
    }
    svgEl('circle', { cx: '0', cy: '-13', r: '2.2', fill: '#ffd700' }, lg);
  });

  pond.koi.forEach(function(fish, i) {
    var kg = svgEl('g', { transform: 'translate(' + fish.x + ' ' + fish.y + ') rotate(' + (fish.angle * 180 / Math.PI) + ')' }, pg);
    svgEl('path', { d: 'M' + (-fish.length / 2) + ' 0 Q0 -3.5 ' + (fish.length / 2) + ' 0 Q0 3.5 ' + (-fish.length / 2) + ' 0Z', fill: fish.color, opacity: '0.75' }, kg);
    svgEl('path', { d: 'M' + (fish.length / 2) + ' 0 L' + (fish.length / 2 + 6) + ' -2.5 L' + (fish.length / 2 + 6) + ' 2.5 Z', fill: fish.color, opacity: '0.75' }, kg);
    svgEl('circle', { cx: String(-fish.length / 2 + 2.5), cy: '-1', r: '0.9', fill: '#1a1a1a' }, kg);
  });

  pond.ripples.forEach(function(ripple, i) {
    svgEl('ellipse', {
      cx: String(ripple.x), cy: String(ripple.y),
      rx: String(ripple.rx || 8), ry: String(ripple.ry || 4),
      fill: 'none', stroke: '#e8efeb', 'stroke-width': '0.8', opacity: '0.5',
    }, pg);
  });
}

function renderPlant(parent, plant, color, wateringBoost) {
  var pg = svgEl('g', { transform: 'translate(' + plant.x + ' ' + plant.y + ') scale(' + plant.scale + ')' }, parent);
  svgEl('path', { d: 'M0 0 Q-1 -18 1 -34', fill: 'none', stroke: color, 'stroke-width': '2.2', 'stroke-linecap': 'round' }, pg);
  svgEl('path', { d: 'M0 -15 Q-13 -22 -17 -12 Q-8 -7 0 -15Z', fill: color, opacity: '0.9' }, pg);
  svgEl('path', { d: 'M0 -24 Q12 -31 16 -21 Q8 -15 0 -24Z', fill: color, opacity: '0.8' }, pg);
}

function renderFlower(parent, flower, color, wateringBoost) {
  var fg = svgEl('g', { transform: 'translate(' + flower.x + ' ' + flower.y + ') scale(' + flower.scale + ')' }, parent);
  svgEl('path', { d: 'M0 0 Q1 -11 0 -22', stroke: '#2d6a30', 'stroke-width': '1.6', fill: 'none' }, fg);
  for (var i = 0; i < 5; i++) {
    svgEl('ellipse', { cx: '0', cy: '-27', rx: '3.2', ry: '7.5', fill: color, transform: 'rotate(' + (i * 72) + ' 0 -27)' }, fg);
  }
  svgEl('circle', { cx: '0', cy: '-27', r: '2.6', fill: '#ffd700' }, fg);
}

function renderFloraCluster(parent, cluster, rawId) {
  var cg = svgEl('g', { transform: 'translate(' + cluster.x + ' ' + cluster.y + ') rotate(' + cluster.rotation + ') scale(' + cluster.scale + ')' }, parent);
  var vitalityBoost = Math.max(0, Math.min(1, cluster.wateringEffectStrength || 1));
  svgEl('ellipse', { cx: '0', cy: '4', rx: '10', ry: '4', fill: 'rgba(40, 44, 24, 0.28)' }, cg);

  var type = cluster.type;
  var rosePetalId = 'rose-petal-' + rawId;
  var lilyPetalId = 'lily-petal-' + rawId;

  if (type === 'rose') {
    svgEl('path', { d: 'M0 0 Q0.5 -16 0 -32', fill: 'none', stroke: '#2d6a30', 'stroke-width': '2.4', 'stroke-linecap': 'round' }, cg);
    svgEl('path', { d: 'M0 -8 Q-9 -14 -11 -9 Q-6 -5 0 -8Z', fill: '#3d8b40' }, cg);
    svgEl('path', { d: 'M0 -18 Q10 -22 12 -17 Q6 -13 0 -18Z', fill: '#4a9a4d' }, cg);
    for (var i = 0; i < 8; i++) {
      svgEl('path', { d: 'M0 -32 Q-5 -40 -2 -47 Q2 -42 0 -32Z', fill: 'url(#' + rosePetalId + ')', opacity: '0.88', transform: 'rotate(' + (i * 45) + ' 0 -32)' }, cg);
    }
    for (var i = 0; i < 6; i++) {
      svgEl('ellipse', { cx: '0', cy: '-36', rx: '3.8', ry: '7.5', fill: 'url(#' + rosePetalId + ')', opacity: '0.95', transform: 'rotate(' + (i * 60) + ' 0 -36)' }, cg);
    }
    for (var i = 0; i < 5; i++) {
      svgEl('ellipse', { cx: '0', cy: '-39', rx: '2.4', ry: '5.5', fill: '#ff69b4', opacity: '0.95', transform: 'rotate(' + (i * 72) + ' 0 -39)' }, cg);
    }
    svgEl('circle', { cx: '0', cy: '-41', r: '3.5', fill: '#c71585' }, cg);
    svgEl('circle', { cx: '0', cy: '-41', r: '1.8', fill: '#ffb7c5' }, cg);
  } else if (type === 'lily') {
    svgEl('path', { d: 'M0 0 Q0.5 -14 0 -30', fill: 'none', stroke: '#2d6a30', 'stroke-width': '2.1', 'stroke-linecap': 'round' }, cg);
    svgEl('path', { d: 'M0 -6 Q-7 -11 -9 -6 Q-4 -3 0 -6Z', fill: '#3d8b40' }, cg);
    svgEl('path', { d: 'M0 -16 Q9 -20 11 -15 Q5 -11 0 -16Z', fill: '#4a9a4d' }, cg);
    for (var i = 0; i < 6; i++) {
      svgEl('path', { d: 'M0 -30 Q-3.5 -38 0 -45 Q3.5 -38 0 -30Z', fill: 'url(#' + lilyPetalId + ')', opacity: '0.95', transform: 'rotate(' + (i * 60) + ' 0 -30)' }, cg);
    }
    svgEl('line', { x1: '0', y1: '-30', x2: '0', y2: '-40', stroke: '#daa520', 'stroke-width': '1.1' }, cg);
    svgEl('circle', { cx: '0', cy: '-41.5', r: '1.4', fill: '#ff8c00' }, cg);
    svgEl('circle', { cx: '-1.4', cy: '-39', r: '0.9', fill: '#ff8c00' }, cg);
    svgEl('circle', { cx: '1.4', cy: '-39', r: '0.9', fill: '#ff8c00' }, cg);
  } else if (type === 'lavender') {
    svgEl('path', { d: 'M0 0 Q0.5 -14 0 -30', fill: 'none', stroke: '#5a8a3c', 'stroke-width': '1.8' }, cg);
    var lavenderColors = ['#b39ddb', '#9575cd', '#7e57c2'];
    for (var i = 0; i < 9; i++) {
      var dx = [-1.6, -0.8, 0, 0.8, 1.6, -2.4, -0.2, 1, 2][i];
      svgEl('ellipse', { cx: String(dx), cy: String(-6 - Math.abs(dx) * 1.2), rx: '2.2', ry: '1.2', fill: lavenderColors[i % 3] }, cg);
    }
  } else if (type === 'daisy') {
    svgEl('line', { x1: '0', y1: '0', x2: '0', y2: '-16', stroke: '#2d6a30', 'stroke-width': '1.4' }, cg);
    for (var i = 0; i < 8; i++) {
      svgEl('ellipse', { cx: '0', cy: '-22', rx: '3', ry: '6.5', fill: ['#ffffff', '#f0f0ec', '#ffffff'][i % 3], transform: 'rotate(' + (i * 45) + ' 0 -22)' }, cg);
    }
    svgEl('circle', { cx: '0', cy: '-22', r: '3.2', fill: '#ffd700' }, cg);
  } else if (type === 'rosemary') {
    svgEl('path', { d: 'M0 0 Q-1.5 -12 -0.5 -24', fill: 'none', stroke: '#4a7a32', 'stroke-width': '1.6' }, cg);
    var rosemaryDx = [-5, -2, 1, 4, -7, -3, 2, 6];
    for (var i = 0; i < rosemaryDx.length; i++) {
      var dx = rosemaryDx[i];
      svgEl('ellipse', { cx: String(dx), cy: String(-4 - Math.abs(dx) * 0.6), rx: '2.5', ry: '1.4', fill: '#5a9a44', transform: 'rotate(' + (dx > 0 ? -30 : 30) + ' ' + dx + ' ' + (-4 - Math.abs(dx) * 0.6) + ')' }, cg);
    }
  } else if (type === 'thyme') {
    var thymeDx = [-3, 0, 3, -5, 5, -2, 2, 4];
    for (var i = 0; i < thymeDx.length; i++) {
      svgEl('ellipse', { cx: String(thymeDx[i]), cy: String(-2 - ((cluster.tone + i) % 5) * 0.7), rx: '2.2', ry: '1.2', fill: '#4a8a36' }, cg);
    }
  } else if (type === 'olive_shrub') {
    svgEl('line', { x1: '0', y1: '0', x2: '-0.5', y2: '-16', stroke: '#6b8a5a', 'stroke-width': '2.2' }, cg);
    var oliveDx = [-5, 5, 0, -8, 8, -2, 2, 6];
    for (var i = 0; i < oliveDx.length; i++) {
      var dx = oliveDx[i];
      var og = svgEl('g', { transform: 'translate(' + dx + ' ' + (-8 - Math.abs(dx) * 0.4) + ') rotate(' + (dx * 5) + ')' }, cg);
      svgEl('ellipse', { cx: '0', cy: '0', rx: '5', ry: '3', fill: '#7a9a68' }, og);
      svgEl('ellipse', { cx: '-1', cy: '-1', rx: '3.5', ry: '2', fill: '#8aaa78' }, og);
    }
  } else if (type === 'floral_wreath') {
    svgEl('path', { d: 'M-9 2 Q0 -4 9 2', fill: 'none', stroke: '#228b22', 'stroke-width': '1.8', opacity: '0.7' }, cg);
    var wreathColors = ['#9b59b6', '#3498db', '#f1c40f'];
    var wreathPositions = [[-5, -6], [-1.5, -9], [2.5, -7], [5, -4], [-7, -3], [7, -2]];
    for (var i = 0; i < wreathPositions.length; i++) {
      var wx = wreathPositions[i][0], wy = wreathPositions[i][1];
      var wg = svgEl('g', { transform: 'translate(' + wx + ' ' + wy + ')' }, cg);
      for (var j = 0; j < 4; j++) {
        svgEl('ellipse', { cx: '0', cy: '0', rx: '1.9', ry: '3.8', fill: wreathColors[i % 3], transform: 'rotate(' + (j * 90) + ' 0 0)' }, wg);
      }
      svgEl('circle', { cx: '0', cy: '0', r: '1.5', fill: '#ffd700' }, wg);
    }
    svgEl('ellipse', { cx: '-9', cy: '0', rx: '4', ry: '2.2', fill: '#3d8b40', transform: 'rotate(20)' }, cg);
    svgEl('ellipse', { cx: '8', cy: '1', rx: '4', ry: '2.2', fill: '#3d8b40', transform: 'rotate(20)' }, cg);
  } else if (type === 'rosal_de_gracia') {
    svgEl('ellipse', { cx: '0', cy: '-8', rx: '14', ry: '7', fill: '#3d6b35', opacity: '0.85' }, cg);
    svgEl('ellipse', { cx: '-5', cy: '-6', rx: '9', ry: '5', fill: '#4a8040', opacity: '0.8' }, cg);
    svgEl('ellipse', { cx: '6', cy: '-10', rx: '10', ry: '5.5', fill: '#4a8040', opacity: '0.75' }, cg);
    svgEl('ellipse', { cx: '0', cy: '-14', rx: '8', ry: '4.5', fill: '#5a9a50', opacity: '0.8' }, cg);
    for (var i = 0; i < 3; i++) {
      var rx = [-6, 5, 0][i];
      var ry = [-10, -13, -16][i];
      var rg = svgEl('g', { transform: 'translate(' + rx + ' ' + ry + ')' }, cg);
      svgEl('path', { d: 'M0 0 Q0.5 -16 0 -32', fill: 'none', stroke: '#2d6a30', 'stroke-width': '2.4', 'stroke-linecap': 'round' }, rg);
      svgEl('path', { d: 'M0 -8 Q-9 -14 -11 -9 Q-6 -5 0 -8Z', fill: '#3d8b40' }, rg);
      for (var j = 0; j < 8; j++) {
        svgEl('path', { d: 'M0 -3 Q-2 -6 0 -8 Q2 -6 0 -3Z', fill: 'url(#' + rosePetalId + ')', opacity: '0.9', transform: 'rotate(' + (j * 45) + ' 0 -3)' }, rg);
      }
      svgEl('circle', { cx: '0', cy: '-3', r: '1.6', fill: '#c71585' }, rg);
    }
  }

  // Dew points
  if (cluster.dewPoints && cluster.dewPoints.length > 0) {
    var dewGroup = svgEl('g', { opacity: '0.85' }, cg);
    cluster.dewPoints.forEach(function(dp, idx) {
      svgEl('circle', {
        cx: String(dp.dx), cy: String(dp.dy), r: String(dp.r),
        fill: '#ffffff', opacity: String(dp.opacity * vitalityBoost),
      }, dewGroup);
    });
  }
}

function renderCentralTree(parent, tree, justWatered, rawId) {
  var tg = svgEl('g', { transform: 'translate(' + tree.x + ' ' + tree.y + ')' }, parent);
  var cedar = tree.cedarExtras;
  if (cedar) {
    // Roots
    cedar.roots.forEach(function(root, i) {
      svgEl('path', { d: root.d, fill: 'none', stroke: root.stroke, 'stroke-width': String(root.strokeWidth), 'stroke-linecap': 'round', opacity: '0.88' }, tg);
    });
    // Shadow
    svgEl('ellipse', { cx: '0', cy: '6', rx: '22', ry: '7.5', fill: 'rgba(40, 44, 24, 0.24)' }, tg);
    // Trunk
    svgEl('path', { d: 'M-10 0 Q-11 ' + (-tree.trunkHeight * 0.5) + ' -9 ' + (-tree.trunkHeight) + ' Q-8 ' + (-tree.trunkHeight * 0.5) + ' -10 0', fill: 'url(#bark-' + rawId + ')' }, tg);
    svgEl('path', { d: 'M9 0 Q10 ' + (-tree.trunkHeight * 0.5) + ' 8 ' + (-tree.trunkHeight) + ' Q7 ' + (-tree.trunkHeight * 0.5) + ' 9 0', fill: 'url(#bark-' + rawId + ')', opacity: '0.8' }, tg);
    // Branches
    tree.branches.forEach(function(branch, i) {
      svgEl('path', { d: branch.d, fill: 'none', stroke: branch.depth % 2 ? '#5a5040' : '#6b5f4a', 'stroke-width': String(branch.width), 'stroke-linecap': 'round', opacity: '0.72' }, tg);
    });
    // Golden patches
    cedar.goldenPatches.forEach(function(patch, i) {
      svgEl('path', { d: patch.d, fill: patch.fill, opacity: String(patch.opacity) }, tg);
    });
    // Canopy layers
    cedar.canopyLayers.forEach(function(layer, i) {
      svgEl('path', { d: layer.d, fill: layer.fill, opacity: String(layer.opacity) }, tg);
    });
    cedar.canopyLayers.forEach(function(layer, i) {
      svgEl('path', { d: layer.d, fill: layer.highlight, opacity: '0.14' }, tg);
    });
  } else {
    // Generic tree
    svgEl('path', { d: 'M-10 0 Q-11 ' + (-tree.trunkHeight * 0.5) + ' -9 ' + (-tree.trunkHeight) + ' Q-8 ' + (-tree.trunkHeight * 0.5) + ' -10 0', fill: 'url(#bark-' + rawId + ')' }, tg);
    svgEl('path', { d: 'M9 0 Q10 ' + (-tree.trunkHeight * 0.5) + ' 8 ' + (-tree.trunkHeight) + ' Q7 ' + (-tree.trunkHeight * 0.5) + ' 9 0', fill: 'url(#bark-' + rawId + ')', opacity: '0.8' }, tg);
    tree.branches.forEach(function(branch, i) {
      svgEl('path', { d: branch.d, fill: 'none', stroke: branch.depth % 2 ? '#5a5040' : '#6b5f4a', 'stroke-width': String(branch.width), 'stroke-linecap': 'round', opacity: '0.72' }, tg);
    });
    // Simple canopy
    var canopyY = tree.y - tree.trunkHeight - 30 * (tree.canopyScale || 1);
    svgEl('ellipse', { cx: '0', cy: String(canopyY), rx: String(40 * (tree.canopyScale || 1)), ry: String(30 * (tree.canopyScale || 1)), fill: '#3d7230' }, tg);
    svgEl('ellipse', { cx: '-10', cy: String(canopyY - 10), rx: String(25 * (tree.canopyScale || 1)), ry: String(20 * (tree.canopyScale || 1)), fill: '#4a8a3a' }, tg);
    svgEl('ellipse', { cx: '10', cy: String(canopyY - 5), rx: String(28 * (tree.canopyScale || 1)), ry: String(22 * (tree.canopyScale || 1)), fill: '#4a8a3a' }, tg);
  }
}

function renderGrottoArch(parent, grotto, tree) {
  var baseY = tree.y - tree.trunkHeight * 0.35;
  var archBaseY = baseY - grotto.height;
  var gg = svgEl('g', { transform: 'translate(' + grotto.x + ' ' + baseY + ')', opacity: '0.92' }, parent);
  svgEl('path', { d: 'M ' + (-grotto.width) + ' 0 Q ' + (-grotto.width) + ' ' + (-grotto.height) + ' 0 ' + (-grotto.height) + ' Q ' + grotto.width + ' ' + (-grotto.height) + ' ' + grotto.width + ' 0', fill: 'none', stroke: '#6b7a5a', 'stroke-width': '2.6', 'stroke-linecap': 'round', opacity: '0.75' }, gg);
  svgEl('path', { d: 'M ' + (-grotto.width + 3) + ' 0 Q ' + (-grotto.width + 3) + ' ' + (-grotto.height + 12) + ' 0 ' + (-grotto.height + 12) + ' Q ' + (grotto.width - 3) + ' ' + (-grotto.height + 12) + ' ' + (grotto.width - 3) + ' 0', fill: 'none', stroke: '#4a5a3a', 'stroke-width': '1.4', 'stroke-linecap': 'round', opacity: '0.55' }, gg);
  svgEl('line', { x1: -grotto.width + 6, y1: -grotto.height + 8, x2: -grotto.width + 6, y2: '0', stroke: '#6b7a5a', 'stroke-width': '2', 'stroke-linecap': 'round', opacity: '0.7' }, gg);
  svgEl('line', { x1: grotto.width - 6, y1: -grotto.height + 8, x2: grotto.width - 6, y2: '0', stroke: '#6b7a5a', 'stroke-width': '2', 'stroke-linecap': 'round', opacity: '0.7' }, gg);
  svgEl('rect', { x: -grotto.width - 5, y: '-2', width: '10', height: '4', fill: '#6b7a5a', rx: '1', opacity: '0.6' }, gg);
  svgEl('rect', { x: grotto.width - 5, y: '-2', width: '10', height: '4', fill: '#6b7a5a', rx: '1', opacity: '0.6' }, gg);
  grotto.vineSeeds.slice(0, grotto.vineCount).forEach(function(seed, i) {
    var vr = createPrng(String(seed));
    var hangY = archBaseY + 6 + vr() * (grotto.height - 18);
    var vineX = -grotto.width + 12 + vr() * (grotto.width * 2 - 24);
    var vineLen = 6 + vr() * 12;
    var vg = svgEl('g', { transform: 'translate(' + vineX + ' ' + hangY + ')' }, gg);
    svgEl('path', { d: 'M0 0 Q' + ((vr() - 0.5) * 6) + ' ' + (vineLen * 0.5) + ' 0 ' + vineLen, fill: 'none', stroke: '#3d6b35', 'stroke-width': '0.9', 'stroke-linecap': 'round', opacity: '0.8' }, vg);
    svgEl('ellipse', { cx: '0', cy: vineLen, rx: '1.1', ry: '2.2', fill: '#4a8040', opacity: '0.85' }, vg);
    svgEl('ellipse', { cx: ((vr() - 0.5) * 3), cy: vineLen * 0.6, rx: '0.9', ry: '1.8', fill: '#5a9a50', opacity: '0.75' }, vg);
  });
  var altarG = svgEl('g', { transform: 'translate(' + (grotto.altarX - grotto.x) + ' ' + (grotto.altarY - baseY) + ')' }, gg);
  svgEl('rect', { x: '-5', y: '-3', width: '10', height: '4', fill: '#7a7a72', rx: '1', opacity: '0.95' }, altarG);
  svgEl('rect', { x: '-4.5', y: '-4.5', width: '9', height: '1.5', fill: '#8a8a82', rx: '0.8', opacity: '0.95' }, altarG);
  svgEl('ellipse', { cx: '0', cy: '1', rx: '6', ry: '2.5', fill: '#6a6a62', opacity: '0.6' }, altarG);
  svgEl('path', { d: 'M ' + (-grotto.width + 1) + ' 0 Q ' + (-grotto.width + 1) + ' ' + (-grotto.height + 6) + ' 0 ' + (-grotto.height + 6) + ' Q ' + (grotto.width - 1) + ' ' + (-grotto.height + 6) + ' ' + (grotto.width - 1) + ' 0', fill: 'none', stroke: '#8a9a78', 'stroke-width': '0.9', opacity: '0.5' }, gg);
}

function renderSacredGeometry(parent, sg) {
  var pts = [];
  var steps = 64;
  for (var i = 0; i <= steps; i++) {
    var angle = sg.rotation + (i / steps) * Math.PI * 2;
    var x = sg.cx + Math.cos(angle) * sg.rx;
    var y = sg.cy + Math.sin(angle) * sg.ry;
    pts.push((i === 0 ? 'M' : 'L') + ' ' + x.toFixed(1) + ' ' + y.toFixed(1));
  }
  var path = pts.join(' ') + ' Z';
  var sgG = svgEl('g', { opacity: '0.28' }, parent);
  svgEl('path', { d: path, fill: 'none', stroke: '#b8c4a8', 'stroke-width': '0.8' }, sgG);
  sg.nodes.forEach(function(node, i) {
    svgEl('circle', { cx: String(node.x), cy: String(node.y), r: '1.6', fill: '#c8d4b8', opacity: '0.8' }, sgG);
  });
}

function renderSignatureGlyph(parent, signature) {
  if (signature.kind === 'star') {
    svgEl('path', { d: 'M0 -10 L3 -3 L10 0 L3 3 L0 10 L-3 3 L-10 0 L-3 -3Z', fill: 'hsl(' + signature.hue + ' 35% 55%)' }, parent);
  } else if (signature.kind === 'flower') {
    var fg = svgEl('g', { transform: 'rotate(' + signature.angle + ')' }, parent);
    for (var i = 0; i < signature.petals; i++) {
      svgEl('ellipse', { cx: '0', cy: '-7', rx: '3.2', ry: '7.5', fill: 'hsl(' + signature.hue + ' 30% 62%)', transform: 'translate(0, -7) rotate(' + ((360 / signature.petals) * i) + ')' }, fg);
    }
    svgEl('circle', { cx: '0', cy: '0', r: '2.8', fill: '#c4a35a' }, fg);
  } else if (signature.kind === 'branch') {
    var bg = svgEl('g', { transform: 'rotate(' + signature.angle + ')' }, parent);
    svgEl('path', { d: 'M-10 8 Q0 0 10 -9', fill: 'none', stroke: 'hsl(' + signature.hue + ' 28% 42%)', 'stroke-width': '2' }, bg);
    svgEl('ellipse', { cx: '-2', cy: '1', rx: '5', ry: '2.5', fill: 'hsl(' + signature.hue + ' 28% 52%)', transform: 'rotate(25)' }, bg);
    svgEl('ellipse', { cx: '5', cy: '-5', rx: '5', ry: '2.5', fill: 'hsl(' + signature.hue + ' 28% 58%)', transform: 'rotate(-25)' }, bg);
  } else {
    svgEl('path', { d: 'M-9 5 Q0 -12 10 -5 Q3 10 -9 5Z', fill: 'hsl(' + signature.hue + ' 28% 52%)', transform: 'rotate(' + signature.angle + ')' }, parent);
  }
}

// ═══════════════════════════════════════════════
//  Control Panel Setup
// ═══════════════════════════════════════════════

function setupControls() {
  var selects = [
    { id: 'dna-terrain', options: TERRAINS, default: 'bosque' },
    { id: 'dna-pathShape', options: PATHS, default: 'curvo' },
    { id: 'dna-treeSpecies', options: TREES, default: 'cedro' },
    { id: 'dna-paletteVariant', options: PALETTES, default: 'variante A' },
    { id: 'dna-flowerSpeciesBias', options: FLOWER_BIAS, default: 'rosas' },
    { id: 'state-season', options: SEASONS, default: 'ordinary' },
    { id: 'state-growthPhase', options: ['1', '2', '3'], default: '1' },
  ];

  selects.forEach(function(s) {
    var el = document.getElementById(s.id);
    if (!el) return;
    s.options.forEach(function(opt) {
      var option = document.createElement('option');
      option.value = opt;
      option.textContent = opt;
      if (opt === s.default) option.selected = true;
      el.appendChild(option);
    });
  });

  // Range inputs
  var ranges = [
    { id: 'dna-rockPattern', valId: 'val-dna-rockPattern', default: 0 },
    { id: 'dna-riverAngle', valId: 'val-dna-riverAngle', default: 0 },
    { id: 'state-totalRosaries', valId: 'val-state-totalRosaries', default: 0 },
    { id: 'state-totalNovenas', valId: 'val-state-totalNovenas', default: 0 },
    { id: 'state-totalCoronillas', valId: 'val-state-totalCoronillas', default: 0 },
    { id: 'state-totalWaterings', valId: 'val-state-totalWaterings', default: 0 },
    { id: 'state-totalSeeds', valId: 'val-state-totalSeeds', default: 0 },
    { id: 'state-totalSilenceMinutes', valId: 'val-state-totalSilenceMinutes', default: 0 },
    { id: 'state-streak', valId: 'val-state-streak', default: 0 },
    { id: 'state-communityPrayer', valId: 'val-state-communityPrayer', default: 0 },
    { id: 'state-waterLevel', valId: 'val-state-waterLevel', default: 0 },
    { id: 'state-lightLevel', valId: 'val-state-lightLevel', default: 22 },
    { id: 'state-health', valId: 'val-state-health', default: 1 },
    { id: 'state-level', valId: 'val-state-level', default: 0 },
    { id: 'state-wateringEffectStrength', valId: 'val-state-wateringEffectStrength', default: 0 },
  ];

  ranges.forEach(function(r) {
    var el = document.getElementById(r.id);
    var valEl = document.getElementById(r.valId);
    if (!el) return;
    el.value = r.default;
    if (valEl) valEl.textContent = r.default;
    el.addEventListener('input', function() {
      if (valEl) valEl.textContent = el.value;
      updatePreview();
    });
  });

  // Checkboxes
  var checkboxes = ['state-showDove', 'state-showDeer', 'state-consolidatedRosal', 'inter-showRain', 'inter-justWatered'];
  checkboxes.forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.addEventListener('change', updatePreview);
  });

  // Text input
  var sigSeed = document.getElementById('dna-signatureSeed');
  if (sigSeed) sigSeed.addEventListener('input', updatePreview);

  // Selects
  selects.forEach(function(s) {
    var el = document.getElementById(s.id);
    if (el) el.addEventListener('change', updatePreview);
  });

  // Reset button
  var resetBtn = document.getElementById('resetBtn');
  if (resetBtn) {
    resetBtn.addEventListener('click', function() {
      resetDefaults();
      updatePreview();
      showToast('Valores reseteados');
    });
  }
}

function resetDefaults() {
  var defaults = {
    'dna-terrain': 'bosque', 'dna-pathShape': 'curvo', 'dna-treeSpecies': 'cedro',
    'dna-rockPattern': '0', 'dna-riverAngle': '0', 'dna-paletteVariant': 'variante A',
    'dna-flowerSpeciesBias': 'rosas', 'dna-signatureSeed': 'demo-seed-001',
    'state-totalRosaries': '0', 'state-totalNovenas': '0', 'state-totalCoronillas': '0',
    'state-totalWaterings': '0', 'state-totalSeeds': '0', 'state-totalSilenceMinutes': '0',
    'state-streak': '0', 'state-communityPrayer': '0', 'state-waterLevel': '0',
    'state-lightLevel': '22', 'state-health': '1', 'state-level': '0',
    'state-growthPhase': '1', 'state-season': 'ordinary',
    'state-showDove': false, 'state-showDeer': false, 'state-consolidatedRosal': false,
    'state-wateringEffectStrength': '0',
    'inter-showRain': false, 'inter-justWatered': false,
  };
  for (var id in defaults) {
    if (!defaults.hasOwnProperty(id)) continue;
    var el = document.getElementById(id);
    if (!el) continue;
    if (el.type === 'checkbox') {
      el.checked = defaults[id];
    } else {
      el.value = defaults[id];
    }
    // Update value display
    var valEl = document.getElementById('val-' + id);
    if (valEl) valEl.textContent = defaults[id];
  }
}

function getTraits() {
  var dnaHex = 'demo' + hashSeed(document.getElementById('dna-signatureSeed').value || 'demo').toString(16).padStart(8, '0');
  return deriveDnaTraits(dnaHex);
}

function getState() {
  return {
    totalRosaries: parseInt(document.getElementById('state-totalRosaries').value) || 0,
    totalNovenas: parseInt(document.getElementById('state-totalNovenas').value) || 0,
    totalCoronillas: parseInt(document.getElementById('state-totalCoronillas').value) || 0,
    totalWaterings: parseInt(document.getElementById('state-totalWaterings').value) || 0,
    totalSeeds: parseInt(document.getElementById('state-totalSeeds').value) || 0,
    totalSilenceMinutes: parseInt(document.getElementById('state-totalSilenceMinutes').value) || 0,
    activeCandles: 0,
    streak: parseInt(document.getElementById('state-streak').value) || 0,
    communityPrayer: parseInt(document.getElementById('state-communityPrayer').value) || 0,
    waterLevel: parseInt(document.getElementById('state-waterLevel').value) || 0,
    lightLevel: parseInt(document.getElementById('state-lightLevel').value) || 22,
    health: parseFloat(document.getElementById('state-health').value) || 1,
    pointsScore: 0,
    level: parseInt(document.getElementById('state-level').value) || 0,
    maturityTier: 1,
    growthPhase: parseInt(document.getElementById('state-growthPhase').value) || 1,
    showEphemeralFlower: false,
    showDove: document.getElementById('state-showDove').checked,
    showDeer: document.getElementById('state-showDeer').checked,
    dewPoints: [],
    consolidatedRosal: document.getElementById('state-consolidatedRosal').checked,
    wateringEffectStrength: parseFloat(document.getElementById('state-wateringEffectStrength').value) || 0,
    lifeRatio: 1,
    birdCount: 0,
    butterflyCount: 0,
    season: document.getElementById('state-season').value,
    lastGrowth: Date.now(),
    lastActivityTime: Date.now(),
  };
}

function updatePreview() {
  var svg = document.getElementById('gardenSvg');
  if (!svg) return;
  var traits = getTraits();
  var state = getState();
  var showRain = document.getElementById('inter-showRain').checked;
  var justWatered = document.getElementById('inter-justWatered').checked;
  renderGarden(svg, traits, state, showRain, justWatered);
  updateStats(state);
}

function updateStats(state) {
  var grid = document.getElementById('statsGrid');
  if (!grid) return;
  var stats = [
    { label: 'Rosarios', val: state.totalRosaries },
    { label: 'Novenas', val: state.totalNovenas },
    { label: 'Coronillas', val: state.totalCoronillas },
    { label: 'Agua', val: state.waterLevel },
    { label: 'Luz', val: state.lightLevel },
    { label: 'Salud', val: state.health.toFixed(2) },
    { label: 'Nivel', val: state.level },
    { label: 'Streak', val: state.streak },
    { label: 'Fase', val: state.growthPhase },
  ];
  grid.innerHTML = stats.map(function(s) {
    return '<div class="stat-item"><div class="stat-val">' + s.val + '</div><div class="stat-label">' + s.label + '</div></div>';
  }).join('');
}

function showToast(msg) {
  var toast = document.getElementById('toast');
  if (!toast) return;
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(function() { toast.classList.remove('show'); }, 2000);
}

// ═══════════════════════════════════════════════
//  Initialize
// ═══════════════════════════════════════════════

document.addEventListener('DOMContentLoaded', function() {
  setupControls();
  updatePreview();
});
</script>
