name = "camino-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["0 4 * * *", "0 11 * * *", "0 19 * * *", "0 22 * * *", "0 1 * * *"]

[[kv_namespaces]]
binding = "DAILY_CACHE"
id = "1391c3a3d0fa470bba4d461221a61499"

[[r2_buckets]]
binding = "CAMINO_AUDIO"
bucket_name = "camino-audio"

[[r2_buckets]]
binding = "CAMINO_IMAGES"
bucket_name = "camino-images"
# Si configuraste un dominio personalizado en Cloudflare R2:
# custom_domain = 'images.camino.app'

[vars]
SUPABASE_URL = "https://asfqkirsogozshlzcfpe.supabase.co"
R2_IMAGES_BASE_URL = "https://images.camino.app"
VERTEX_PROJECT_ID = "camino-503318"
VERTEX_REGION = "us-central1"
